[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "transformer-foundations"
version = "0.1.0"
description = "Stanford CS336 Assignment 1: a decoder-only language model and BPE tokenizer in plain PyTorch"
authors = [
    { name = "Abdullah Madoun" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "numpy>=1.24.0",
    "einops>=0.7.0",
    "regex>=2023.10.0",
    "tqdm>=4.66.0",
    "wandb>=0.16.0",
    "pytest>=7.4.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "jupyter>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
